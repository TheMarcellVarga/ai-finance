openapi: 3.1.0
info:
  title: Aperture Finance API
  version: 0.1.0
  description: Go finance/data API for the AI financial intelligence workspace.
servers:
  - url: http://127.0.0.1:8080
security:
  - ClerkBearer: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/assets/search:
    get:
      operationId: searchAssets
      security: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
        - in: query
          name: assetClass
          schema:
            type: string
          required: false
        - in: query
          name: countryCode
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
          required: false
        - in: query
          name: region
          schema:
            type: string
          required: false
        - in: query
          name: currency
          schema:
            type: string
            pattern: "^[A-Za-z]{3}$"
          required: false
        - in: query
          name: exchange
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          required: false
      responses:
        "200":
          description: Matching real-provider assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSearchResponse"
  /v1/assets/catalog:
    get:
      operationId: getAssetCatalog
      security: []
      responses:
        "200":
          description: Global asset class and geography catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCatalogResponse"
  /v1/market-monitors/{class}:
    get:
      operationId: getMarketMonitor
      security: []
      parameters:
        - in: path
          name: class
          required: true
          schema:
            type: string
            description: Asset monitor ID, excluding crypto which has its dedicated monitor route.
      responses:
        "200":
          description: Free public asset-class monitor snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketMonitorResponse"
        "404":
          description: Monitor class is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/assets/{ticker}/quote:
    get:
      operationId: getAssetQuote
      security: []
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest real-provider quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
  /v1/assets/{ticker}/intraday:
    get:
      operationId: getAssetIntraday
      security: []
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
        - in: query
          name: interval
          required: false
          schema:
            type: string
            enum: [1min, 5min, 15min, 30min, 45min, 1h]
      responses:
        "200":
          description: Intraday real-provider price series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntradayResponse"
  /v1/me:
    get:
      operationId: getCurrentPrincipal
      responses:
        "200":
          description: Authenticated principal context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/usage:
    get:
      operationId: getUsage
      responses:
        "200":
          description: Current usage shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/flip-digest/preferences:
    get:
      operationId: getFlipDigestPreferences
      summary: Get owner-scoped confirmed-flip digest preferences
      responses:
        "200":
          description: Saved preferences or opt-in defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlipDigestPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: putFlipDigestPreferences
      summary: Replace owner-scoped confirmed-flip digest preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlipDigestPreferences"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlipDigestPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/flip-digest/notifications:
    get:
      operationId: listFlipDigestNotifications
      summary: List owner-scoped in-app confirmed-flip digests
      responses:
        "200":
          description: Recent digests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlipDigestNotificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/portfolios:
    get:
      operationId: listPortfolios
      responses:
        "200":
          description: Owner-scoped portfolios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Created portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/portfolios/{id}:
    get:
      operationId: getPortfolio
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Owner-scoped portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePortfolio
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortfolioRequest"
      responses:
        "200":
          description: Updated portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePortfolio
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted portfolio
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/portfolios/{id}/holdings:
    post:
      operationId: addHolding
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddHoldingRequest"
      responses:
        "200":
          description: Portfolio with added holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/watchlists:
    get:
      operationId: listWatchlists
      responses:
        "200":
          description: Owner-scoped watchlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWatchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchlistRequest"
      responses:
        "201":
          description: Created watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/watchlists/{id}/items:
    post:
      operationId: addWatchlistItem
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchlistItemRequest"
      responses:
        "200":
          description: Watchlist with added item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces:
    get:
      operationId: listResearchWorkspaces
      responses:
        "200":
          description: Owner-scoped research workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchWorkspaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createResearchWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchWorkspaceRequest"
      responses:
        "201":
          description: Created research workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchWorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/research/workspaces/{workspaceId}:
    get:
      operationId: getResearchWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Owner-scoped research workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchWorkspaceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces/{workspaceId}/documents:
    get:
      operationId: listResearchDocuments
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Owner-scoped research documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocumentListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadResearchDocument
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  maxLength: 200
      responses:
        "202":
          description: Document stored and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocumentResponse"
        "400":
          description: Invalid file, signature, MIME type, or size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces/{workspaceId}/search:
    post:
      operationId: searchResearchEvidence
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchSearchRequest"
      responses:
        "200":
          description: Owner-filtered evidence results with retrieval diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSearchResponse"
        "400":
          description: Invalid query, limit, or document filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces/{workspaceId}/analysis-runs/{runId}/review-events:
    get:
      operationId: listResearchAnalysisReviewEvents
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Append-only human review history for an owner-scoped analysis run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchAnalysisReviewEventListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: appendResearchAnalysisReviewEvent
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendResearchAnalysisReviewEventRequest"
      responses:
        "201":
          description: Human review event appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchAnalysisReviewEventResponse"
        "400":
          description: Invalid review event payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The decision, edit, or citation target no longer matches the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/research/workspaces/{workspaceId}/documents/{documentId}:
    get:
      operationId: getResearchDocument
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Owner-scoped document processing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocumentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces/{workspaceId}/documents/{documentId}/retry:
    post:
      operationId: retryResearchDocument
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "202":
          description: Failed document queued for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocumentResponse"
        "409":
          description: Document is not retryable from its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/research/workspaces/{workspaceId}/documents/{documentId}/pages:
    get:
      operationId: listResearchDocumentPages
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Page-aware parsed document records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPageListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    ClerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session JWT validated by the Go API.
  responses:
    Unauthorized:
      description: Authentication failed or is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found or is not owned by the current user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    Asset:
      type: object
      required: [ticker, name, exchange, type]
      properties:
        ticker:
          type: string
        name:
          type: string
        exchange:
          type: string
        type:
          type: string
          description: Legacy alias for assetClass.
        assetClass:
          type: string
          description: Canonical asset taxonomy ID.
        sector:
          type: string
        cik:
          type: string
        countryCode:
          type: string
          pattern: "^[A-Z]{2}$"
        country:
          type: string
        region:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        mic:
          type: string
        isin:
          type: string
        cusip:
          type: string
        figi:
          type: string
        providerSymbol:
          type: string
        capturedAt:
          type: string
          format: date-time
        freshness:
          type: string
        provider:
          type: string
        displayPrice:
          type: string
        dailyChangeBps:
          type: integer
    AssetSearchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        meta:
          type: object
          required: [provider, freshness]
          properties:
            query:
              type: string
            provider:
              type: string
            freshness:
              type: string
            assetClass:
              type: string
            countryCode:
              type: string
            region:
              type: string
            currency:
              type: string
            exchange:
              type: string
            coverage:
              type: string
    AssetClassDefinition:
      type: object
      required: [id, label, description]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
    AssetCatalogResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [assetClasses, regions, countryCoverage, currencyStandard]
          properties:
            assetClasses:
              type: array
              items:
                $ref: "#/components/schemas/AssetClassDefinition"
            regions:
              type: array
              items:
                type: string
            countryCoverage:
              type: object
              required: [standard, acceptedCodePattern, allCodesAccepted, scope]
              properties:
                standard:
                  type: string
                acceptedCodePattern:
                  type: string
                allCodesAccepted:
                  type: boolean
                scope:
                  type: string
            currencyStandard:
              type: string
        meta:
          $ref: "#/components/schemas/ContractMeta"
    MarketMonitorPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
    MarketMonitorRow:
      type: object
      required: [symbol, name, price, displayValue, dailyChangePercent, monthlyChangePercent, sparkline, provider, sourceUrl, capturedAt]
      properties:
        symbol:
          type: string
        name:
          type: string
        venue:
          type: string
        currency:
          type: string
        unit:
          type: string
        price:
          type: number
        displayValue:
          type: string
        dailyChangePercent:
          type: number
        monthlyChangePercent:
          type: number
        volume:
          type: number
        sparkline:
          type: array
          items:
            $ref: "#/components/schemas/MarketMonitorPoint"
        provider:
          type: string
        sourceUrl:
          type: string
          format: uri
        capturedAt:
          type: string
          format: date-time
        isProxy:
          type: boolean
        proxyNote:
          type: string
    MarketMonitorClassSummary:
      type: object
      required: [id, label, description, coverage]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        coverage:
          type: string
    MarketMonitorMeta:
      type: object
      required: [assetClass, label, description, provider, providerLabel, freeApi, capturedAt, requestedMarkets, returnedMarkets, failedMarkets, coverage, quoteConvention, freshness, failureReasons, availableClasses]
      properties:
        assetClass:
          type: string
        label:
          type: string
        description:
          type: string
        provider:
          type: string
        providerLabel:
          type: string
        freeApi:
          type: boolean
        capturedAt:
          type: string
          format: date-time
        requestedMarkets:
          type: integer
        returnedMarkets:
          type: integer
        failedMarkets:
          type: integer
        coverage:
          type: string
        quoteConvention:
          type: string
        freshness:
          type: string
        failureReasons:
          type: array
          items:
            type: string
        availableClasses:
          type: array
          items:
            $ref: "#/components/schemas/MarketMonitorClassSummary"
    MarketMonitorResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MarketMonitorRow"
        meta:
          $ref: "#/components/schemas/MarketMonitorMeta"
    QuoteSnapshot:
      type: object
      required: [ticker, priceCents, displayPrice, timestamp, provider, freshness]
      properties:
        ticker:
          type: string
        priceCents:
          type: integer
        displayPrice:
          type: string
        dailyChangeBps:
          type: integer
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        timestamp:
          type: string
          format: date-time
        provider:
          type: string
        freshness:
          type: string
    QuoteResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/QuoteSnapshot"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    IntradayPoint:
      type: object
      required: [timestamp, closeCents, displayClose, provider]
      properties:
        timestamp:
          type: string
          format: date-time
        closeCents:
          type: integer
        displayClose:
          type: string
        volume:
          type: integer
        provider:
          type: string
    IntradayResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IntradayPoint"
        meta:
          allOf:
            - $ref: "#/components/schemas/ContractMeta"
            - type: object
              properties:
                ticker:
                  type: string
                interval:
                  type: string
    PrincipalResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [clerkUserId, issuer]
          properties:
            clerkUserId:
              type: string
            email:
              type: string
            issuer:
              type: string
    UsageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [clerkUserId, period, plan, features]
          properties:
            clerkUserId:
              type: string
            period:
              type: string
            plan:
              type: string
            features:
              type: array
              items:
                type: object
                required: [feature, used, limit, status]
                properties:
                  feature:
                    type: string
                  used:
                    type: integer
                  limit:
                    type: integer
                  status:
                    type: string
    FlipDigestPreferences:
      type: object
      required: [enabled, direction, cadence, emailEnabled, inAppEnabled]
      properties:
        enabled:
          type: boolean
        direction:
          type: string
          enum: [bull, bear, both]
        cadence:
          type: string
          enum: [daily, weekly]
        emailEnabled:
          type: boolean
        inAppEnabled:
          type: boolean
    FlipDigestPreferencesResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FlipDigestPreferences"
    FlipDigestNotificationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, periodStart, periodEnd, direction, cadence, entries, coverage]
            properties:
              id:
                type: string
              periodStart:
                type: string
                format: date-time
              periodEnd:
                type: string
                format: date-time
              direction:
                type: string
              cadence:
                type: string
              entries:
                type: array
                items:
                  type: object
                  required: [assetClass, symbol, direction, lastFlipAt, source, capturedAt]
                  properties:
                    assetClass:
                      type: string
                    symbol:
                      type: string
                    direction:
                      type: string
                    lastFlipAt:
                      type: string
                      format: date-time
                    source:
                      type: string
                    capturedAt:
                      type: string
                      format: date-time
              coverage:
                type: object
    ContractMeta:
      type: object
      required: [provider, freshness, capturedAt]
      properties:
        provider:
          type: string
        freshness:
          type: string
        capturedAt:
          type: string
          format: date-time
    DataFreshness:
      type: object
      required: [provider, capturedAt, freshness]
      properties:
        provider:
          type: string
        capturedAt:
          type: string
          format: date-time
        freshness:
          type: string
    Allocation:
      type: object
      required: [label, weightBps, status]
      properties:
        label:
          type: string
        weightBps:
          type: integer
        status:
          type: string
          enum: [ok, review]
    Holding:
      type: object
      required: [id, asset, quantity, displayQuantity, displayAvgCost, marketValueCents, displayValue, weightBps]
      properties:
        id:
          type: string
        asset:
          $ref: "#/components/schemas/Asset"
        quantity:
          type: integer
        displayQuantity:
          type: string
        displayAvgCost:
          type: string
        marketValueCents:
          type: integer
          format: int64
          minimum: 0
        displayValue:
          type: string
        weightBps:
          type: integer
        notes:
          type: string
    PortfolioSummary:
      type: object
      required: [totalValueCents, displayTotalValue, topConcentrationTicker, topConcentrationBps, holdingCount, reviewFlags]
      properties:
        totalValueCents:
          type: integer
          format: int64
          minimum: 0
        displayTotalValue:
          type: string
        topConcentrationTicker:
          type: string
        topConcentrationBps:
          type: integer
        holdingCount:
          type: integer
        reviewFlags:
          type: integer
    Portfolio:
      type: object
      required: [id, name, baseCurrency, visibility, holdings, transactions, summary, allocation, dataFreshness]
      properties:
        id:
          type: string
        name:
          type: string
        baseCurrency:
          type: string
        visibility:
          type: string
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/Holding"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        summary:
          $ref: "#/components/schemas/PortfolioSummary"
        allocation:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"
    Transaction:
      type: object
      required: [id, type, transactionDate, displayAmount]
      properties:
        id:
          type: string
        assetTicker:
          type: string
        type:
          type: string
          enum: [buy, sell, deposit, withdrawal, dividend]
        transactionDate:
          type: string
          format: date
        quantity:
          type: integer
        displayQuantity:
          type: string
        displayAmount:
          type: string
        notes:
          type: string
    PortfolioListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    PortfolioResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Portfolio"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    CreatePortfolioRequest:
      type: object
      properties:
        name:
          type: string
        baseCurrency:
          type: string
        initialHoldings:
          type: array
          items:
            type: object
            required: [ticker]
            properties:
              ticker:
                type: string
              quantity:
                type: integer
              averageCostCents:
                type: integer
              notes:
                type: string
    UpdatePortfolioRequest:
      type: object
      properties:
        name:
          type: string
        baseCurrency:
          type: string
    AddHoldingRequest:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
        quantity:
          type: integer
        averageCostCents:
          type: integer
        notes:
          type: string
    WatchlistItem:
      type: object
      required: [id, asset]
      properties:
        id:
          type: string
        asset:
          $ref: "#/components/schemas/Asset"
        notes:
          type: string
    Watchlist:
      type: object
      required: [id, name, items, dataFreshness]
      properties:
        id:
          type: string
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItem"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"
    WatchlistListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Watchlist"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    WatchlistResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Watchlist"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    CreateWatchlistRequest:
      type: object
      properties:
        name:
          type: string
        initialAssets:
          type: array
          items:
            type: string
    AddWatchlistItemRequest:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
        notes:
          type: string
    ResearchMeta:
      type: object
      required: [persistence]
      properties:
        persistence:
          type: string
          enum: [memory, postgres]
        storage:
          type: string
          enum: [memory, local-private, supabase-private]
    ResearchWorkspace:
      type: object
      required: [id, name, description, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResearchDocument:
      type: object
      required:
        [id, workspaceId, title, originalFilename, mimeType, byteSize, sha256, status, attemptCount, pageCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
        originalFilename:
          type: string
        mimeType:
          type: string
          enum: [application/pdf, text/plain]
        byteSize:
          type: integer
          format: int64
          maximum: 10485760
        sha256:
          type: string
        status:
          type: string
          enum: [uploading, queued, processing, ready, failed]
        attemptCount:
          type: integer
        errorCode:
          type: string
        errorMessage:
          type: string
        pageCount:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        parsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResearchPage:
      type: object
      required: [id, documentId, workspaceId, pageNumber, normalizedText, textSha256, characterCount, sourceMetadata]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        pageNumber:
          type: integer
          minimum: 1
        normalizedText:
          type: string
        textSha256:
          type: string
        characterCount:
          type: integer
        sourceMetadata:
          type: object
          additionalProperties: true
    ResearchSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 500
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        documentIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
    ResearchAnalysisReviewEvent:
      type: object
      required: [id, requestId, analysisRunId, sectionKey, eventType, outputSha256, createdAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        analysisRunId:
          type: string
          format: uuid
        sectionKey:
          type: string
          enum: [executive_summary, operating_signals, risk_factors, questions_for_review]
        eventType:
          type: string
          enum: [edit_saved, accepted, rejected, citation_flagged]
        contentEventId:
          type: string
          format: uuid
        sectionTitle:
          type: string
          maxLength: 160
        sectionBody:
          type: string
          maxLength: 12000
        note:
          type: string
          maxLength: 2000
        citationChunkId:
          type: string
          format: uuid
        outputSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        createdAt:
          type: string
          format: date-time
    AppendResearchAnalysisReviewEventRequest:
      type: object
      additionalProperties: false
      required: [requestId, sectionKey, eventType]
      properties:
        requestId:
          type: string
          format: uuid
        sectionKey:
          type: string
          enum: [executive_summary, operating_signals, risk_factors, questions_for_review]
        eventType:
          type: string
          enum: [edit_saved, accepted, rejected, citation_flagged]
        contentEventId:
          type: string
          format: uuid
        sectionTitle:
          type: string
          maxLength: 160
        sectionBody:
          type: string
          maxLength: 12000
        note:
          type: string
          maxLength: 2000
        citationChunkId:
          type: string
          format: uuid
    EvidenceResult:
      type: object
      required:
        [chunkId, documentId, documentTitle, pageNumber, sequence, snippet, sourceLocator, headingPath, chunkerVersion, embeddingProvider, embeddingModel, embeddingVersion, vectorSimilarity, lexicalScore, combinedScore]
      properties:
        chunkId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        documentTitle:
          type: string
        pageNumber:
          type: integer
          minimum: 1
        sequence:
          type: integer
          minimum: 0
        snippet:
          type: string
        sourceLocator:
          type: string
        sectionLabel:
          type: string
        headingPath:
          type: array
          items:
            type: string
        chunkerVersion:
          type: string
        embeddingProvider:
          type: string
        embeddingModel:
          type: string
        embeddingVersion:
          type: string
        vectorSimilarity:
          type: number
          format: double
        lexicalScore:
          type: number
          format: double
        combinedScore:
          type: number
          format: double
    EmbeddingDescriptor:
      type: object
      required: [provider, model, version, dimensions, externalCalls]
      properties:
        provider:
          type: string
        model:
          type: string
        version:
          type: string
        dimensions:
          type: integer
        externalCalls:
          type: boolean
    RetrievalDiagnostics:
      type: object
      required:
        [runId, querySha256, filters, chunkerVersion, embedding, requestedLimit, candidateCount, resultCount, duplicatesSuppressed, stageTimingsMs]
      properties:
        runId:
          type: string
          format: uuid
        querySha256:
          type: string
        filters:
          type: object
          required: [workspaceId, documentIds]
          properties:
            workspaceId:
              type: string
              format: uuid
            documentIds:
              type: array
              items:
                type: string
                format: uuid
        chunkerVersion:
          type: string
        embedding:
          $ref: "#/components/schemas/EmbeddingDescriptor"
        requestedLimit:
          type: integer
        candidateCount:
          type: integer
        resultCount:
          type: integer
        duplicatesSuppressed:
          type: integer
        stageTimingsMs:
          type: object
          additionalProperties:
            type: integer
    CreateResearchWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
    ResearchWorkspaceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResearchWorkspace"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchWorkspaceResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ResearchWorkspace"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchDocumentListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResearchDocument"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchDocumentResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ResearchDocument"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchPageListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResearchPage"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchAnalysisReviewEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResearchAnalysisReviewEvent"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchAnalysisReviewEventResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ResearchAnalysisReviewEvent"
        meta:
          allOf:
            - $ref: "#/components/schemas/ResearchMeta"
            - type: object
              properties:
                replayed:
                  type: boolean
    ResearchSearchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [results, diagnostics]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/EvidenceResult"
            diagnostics:
              $ref: "#/components/schemas/RetrievalDiagnostics"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
