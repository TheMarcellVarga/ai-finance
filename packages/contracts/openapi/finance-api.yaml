openapi: 3.1.0
info:
  title: Aperture Finance API
  version: 0.1.0
  description: Go finance/data API for the AI financial intelligence workspace.
servers:
  - url: http://127.0.0.1:8080
security:
  - ClerkBearer: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/assets/search:
    get:
      operationId: searchAssets
      security: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Matching real-provider assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSearchResponse"
  /v1/assets/{ticker}/quote:
    get:
      operationId: getAssetQuote
      security: []
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest real-provider quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
  /v1/assets/{ticker}/intraday:
    get:
      operationId: getAssetIntraday
      security: []
      parameters:
        - in: path
          name: ticker
          required: true
          schema:
            type: string
        - in: query
          name: interval
          required: false
          schema:
            type: string
            enum: [1min, 5min, 15min, 30min, 45min, 1h]
      responses:
        "200":
          description: Intraday real-provider price series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntradayResponse"
  /v1/me:
    get:
      operationId: getCurrentPrincipal
      responses:
        "200":
          description: Authenticated principal context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrincipalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/usage:
    get:
      operationId: getUsage
      responses:
        "200":
          description: Current usage shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/portfolios:
    get:
      operationId: listPortfolios
      responses:
        "200":
          description: Owner-scoped portfolios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioRequest"
      responses:
        "201":
          description: Created portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/portfolios/{id}:
    get:
      operationId: getPortfolio
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Owner-scoped portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePortfolio
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortfolioRequest"
      responses:
        "200":
          description: Updated portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePortfolio
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted portfolio
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/portfolios/{id}/holdings:
    post:
      operationId: addHolding
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddHoldingRequest"
      responses:
        "200":
          description: Portfolio with added holding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/watchlists:
    get:
      operationId: listWatchlists
      responses:
        "200":
          description: Owner-scoped watchlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createWatchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchlistRequest"
      responses:
        "201":
          description: Created watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/watchlists/{id}/items:
    post:
      operationId: addWatchlistItem
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchlistItemRequest"
      responses:
        "200":
          description: Watchlist with added item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces:
    get:
      operationId: listResearchWorkspaces
      responses:
        "200":
          description: Owner-scoped research workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchWorkspaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createResearchWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchWorkspaceRequest"
      responses:
        "201":
          description: Created research workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchWorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/research/workspaces/{workspaceId}:
    get:
      operationId: getResearchWorkspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Owner-scoped research workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchWorkspaceResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces/{workspaceId}/documents:
    get:
      operationId: listResearchDocuments
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Owner-scoped research documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocumentListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadResearchDocument
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  maxLength: 200
      responses:
        "202":
          description: Document stored and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocumentResponse"
        "400":
          description: Invalid file, signature, MIME type, or size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces/{workspaceId}/documents/{documentId}:
    get:
      operationId: getResearchDocument
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Owner-scoped document processing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocumentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/research/workspaces/{workspaceId}/documents/{documentId}/retry:
    post:
      operationId: retryResearchDocument
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "202":
          description: Failed document queued for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchDocumentResponse"
        "409":
          description: Document is not retryable from its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/research/workspaces/{workspaceId}/documents/{documentId}/pages:
    get:
      operationId: listResearchDocumentPages
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Page-aware parsed document records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchPageListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    ClerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session JWT validated by the Go API.
  responses:
    Unauthorized:
      description: Authentication failed or is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found or is not owned by the current user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      in: path
      name: documentId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    Asset:
      type: object
      required: [ticker, name, exchange, type]
      properties:
        ticker:
          type: string
        name:
          type: string
        exchange:
          type: string
        type:
          type: string
          enum: [equity, etf]
        sector:
          type: string
        cik:
          type: string
        capturedAt:
          type: string
          format: date-time
        freshness:
          type: string
        provider:
          type: string
        displayPrice:
          type: string
        dailyChangeBps:
          type: integer
    AssetSearchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        meta:
          type: object
          required: [provider, freshness]
          properties:
            query:
              type: string
            provider:
              type: string
            freshness:
              type: string
    QuoteSnapshot:
      type: object
      required: [ticker, priceCents, displayPrice, timestamp, provider, freshness]
      properties:
        ticker:
          type: string
        priceCents:
          type: integer
        displayPrice:
          type: string
        dailyChangeBps:
          type: integer
        timestamp:
          type: string
          format: date-time
        provider:
          type: string
        freshness:
          type: string
    QuoteResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/QuoteSnapshot"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    IntradayPoint:
      type: object
      required: [timestamp, closeCents, displayClose, provider]
      properties:
        timestamp:
          type: string
          format: date-time
        closeCents:
          type: integer
        displayClose:
          type: string
        volume:
          type: integer
        provider:
          type: string
    IntradayResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/IntradayPoint"
        meta:
          allOf:
            - $ref: "#/components/schemas/ContractMeta"
            - type: object
              properties:
                ticker:
                  type: string
                interval:
                  type: string
    PrincipalResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [clerkUserId, issuer]
          properties:
            clerkUserId:
              type: string
            email:
              type: string
            issuer:
              type: string
    UsageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [clerkUserId, period, plan, features]
          properties:
            clerkUserId:
              type: string
            period:
              type: string
            plan:
              type: string
            features:
              type: array
              items:
                type: object
                required: [feature, used, limit, status]
                properties:
                  feature:
                    type: string
                  used:
                    type: integer
                  limit:
                    type: integer
                  status:
                    type: string
    ContractMeta:
      type: object
      required: [provider, freshness, capturedAt]
      properties:
        provider:
          type: string
        freshness:
          type: string
        capturedAt:
          type: string
          format: date-time
    DataFreshness:
      type: object
      required: [provider, capturedAt, freshness]
      properties:
        provider:
          type: string
        capturedAt:
          type: string
          format: date-time
        freshness:
          type: string
    Allocation:
      type: object
      required: [label, weightBps, status]
      properties:
        label:
          type: string
        weightBps:
          type: integer
        status:
          type: string
          enum: [ok, review]
    Holding:
      type: object
      required: [id, asset, quantity, displayQuantity, displayAvgCost, displayValue, weightBps]
      properties:
        id:
          type: string
        asset:
          $ref: "#/components/schemas/Asset"
        quantity:
          type: integer
        displayQuantity:
          type: string
        displayAvgCost:
          type: string
        displayValue:
          type: string
        weightBps:
          type: integer
        notes:
          type: string
    PortfolioSummary:
      type: object
      required: [displayTotalValue, topConcentrationTicker, topConcentrationBps, holdingCount, reviewFlags]
      properties:
        displayTotalValue:
          type: string
        topConcentrationTicker:
          type: string
        topConcentrationBps:
          type: integer
        holdingCount:
          type: integer
        reviewFlags:
          type: integer
    Portfolio:
      type: object
      required: [id, name, baseCurrency, visibility, holdings, transactions, summary, allocation, dataFreshness]
      properties:
        id:
          type: string
        name:
          type: string
        baseCurrency:
          type: string
        visibility:
          type: string
        holdings:
          type: array
          items:
            $ref: "#/components/schemas/Holding"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        summary:
          $ref: "#/components/schemas/PortfolioSummary"
        allocation:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"
    Transaction:
      type: object
      required: [id, type, transactionDate, displayAmount]
      properties:
        id:
          type: string
        assetTicker:
          type: string
        type:
          type: string
          enum: [buy, sell, deposit, withdrawal, dividend]
        transactionDate:
          type: string
          format: date
        quantity:
          type: integer
        displayQuantity:
          type: string
        displayAmount:
          type: string
        notes:
          type: string
    PortfolioListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Portfolio"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    PortfolioResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Portfolio"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    CreatePortfolioRequest:
      type: object
      properties:
        name:
          type: string
        baseCurrency:
          type: string
        initialHoldings:
          type: array
          items:
            type: object
            required: [ticker]
            properties:
              ticker:
                type: string
              quantity:
                type: integer
              averageCostCents:
                type: integer
              notes:
                type: string
    UpdatePortfolioRequest:
      type: object
      properties:
        name:
          type: string
        baseCurrency:
          type: string
    AddHoldingRequest:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
        quantity:
          type: integer
        averageCostCents:
          type: integer
        notes:
          type: string
    WatchlistItem:
      type: object
      required: [id, asset]
      properties:
        id:
          type: string
        asset:
          $ref: "#/components/schemas/Asset"
        notes:
          type: string
    Watchlist:
      type: object
      required: [id, name, items, dataFreshness]
      properties:
        id:
          type: string
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItem"
        dataFreshness:
          $ref: "#/components/schemas/DataFreshness"
    WatchlistListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Watchlist"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    WatchlistResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Watchlist"
        meta:
          $ref: "#/components/schemas/ContractMeta"
    CreateWatchlistRequest:
      type: object
      properties:
        name:
          type: string
        initialAssets:
          type: array
          items:
            type: string
    AddWatchlistItemRequest:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
        notes:
          type: string
    ResearchMeta:
      type: object
      required: [persistence]
      properties:
        persistence:
          type: string
          enum: [memory, postgres]
        storage:
          type: string
          enum: [memory, local-private, supabase-private]
    ResearchWorkspace:
      type: object
      required: [id, name, description, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResearchDocument:
      type: object
      required:
        [id, workspaceId, title, originalFilename, mimeType, byteSize, sha256, status, attemptCount, pageCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
        originalFilename:
          type: string
        mimeType:
          type: string
          enum: [application/pdf, text/plain]
        byteSize:
          type: integer
          format: int64
          maximum: 10485760
        sha256:
          type: string
        status:
          type: string
          enum: [uploading, queued, processing, ready, failed]
        attemptCount:
          type: integer
        errorCode:
          type: string
        errorMessage:
          type: string
        pageCount:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        parsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResearchPage:
      type: object
      required: [id, documentId, workspaceId, pageNumber, normalizedText, textSha256, characterCount, sourceMetadata]
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        pageNumber:
          type: integer
          minimum: 1
        normalizedText:
          type: string
        textSha256:
          type: string
        characterCount:
          type: integer
        sourceMetadata:
          type: object
          additionalProperties: true
    CreateResearchWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 1000
    ResearchWorkspaceListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResearchWorkspace"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchWorkspaceResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ResearchWorkspace"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchDocumentListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResearchDocument"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchDocumentResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ResearchDocument"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ResearchPageListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResearchPage"
        meta:
          $ref: "#/components/schemas/ResearchMeta"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
