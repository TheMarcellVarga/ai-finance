apiVersion: apps/v1
kind: Deployment
metadata:
  name: aperture-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aperture-api
  template:
    metadata:
      labels:
        app: aperture-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/ai-finance-api:RELEASE_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: aperture-runtime
            - secretRef:
                name: aperture-secrets
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: aperture-api
spec:
  selector:
    app: aperture-api
  ports:
    - name: http
      port: 80
      targetPort: http
